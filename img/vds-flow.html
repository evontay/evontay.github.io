<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css?family=Raleway:400,600,700" rel="stylesheet">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #fbf8f4;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-family: 'Raleway', Helvetica, Arial, sans-serif;
  }
  .stage { width: 100%; max-width: 2100px; aspect-ratio: 2100 / 1330; }
  svg { width: 100%; height: 100%; display: block; }

  text {
    fill: #999;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-anchor: middle;
  }
  .bucket-label { font-size: 18px; fill: #fff; dominant-baseline: middle; }
  .bucket { fill-opacity: 0.9; stroke-width: 2; }
  .bucket-accept { fill: #8fa9a3; stroke: #728e88; }
  .bucket-decline { fill: #b9a29b; stroke: #948577; }

  .lt-node {
    fill: #c9a24a;
    transform-box: fill-box;
    transform-origin: center;
    animation: ltPulse 5.333s ease-in-out infinite;
  }
  @keyframes ltPulse {
    0%, 64.77%, 73.86%, 82.95%, 89.77%, 100% { transform: scale(1); }
    69.32%, 78.41%, 87.5% { transform: scale(1.25); }
  }

  .vds {
    fill: #4a4a4a;
    transform-box: view-box;
    transform-origin: 0 0;
    animation: vdsTravel 5.333s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes vdsTravel {
    0%      { transform: translate(234px,104px) scale(1); }
    1.28%   { transform: translate(234px,104px) scale(1); }
    7.69%   { transform: translate(794px,229px) scale(1); }
    21.15%  { transform: translate(234px,314px) scale(1); }
    27.56%  { transform: translate(794px,314px) scale(1); }
    41.03%  { transform: translate(234px,524px) scale(1); }
    47.44%  { transform: translate(794px,399px) scale(1); }
    50%     { transform: translate(830px,300px) scale(1); }
    55.68%  { transform: translate(830px,300px) scale(1); }
    60.23%  { transform: translate(830px,300px) scale(1.25); }
    64.77%  { transform: translate(830px,300px) scale(1); }
    73.86%  { transform: translate(830px,300px) scale(1); }
    69.32%  { transform: translate(830px,300px) scale(1.25); }
    78.41%  { transform: translate(830px,300px) scale(1.25); }
    87.5%   { transform: translate(830px,300px) scale(1); }
    88.64%  { transform: translate(830px,300px) scale(1); }
    100%    { transform: translate(234px,104px) scale(1); }
  }

  .req {
    transform-box: view-box;
    transform-origin: 0 0;
    animation-duration: 5.333s;
    animation-timing-function: cubic-bezier(.4,0,.2,1);
    animation-iteration-count: infinite;
  }

  @keyframes req1-accept {
    0%      { transform: translate(-60px,90px) scale(1); opacity: 1; }
    0.64%   { transform: translate(220px,90px) scale(1); opacity: 1; }
    1.28%   { transform: translate(220px,90px) scale(1); opacity: 1; }
    7.69%   { transform: translate(780px,215px) scale(1); opacity: 1; }
    88.64%  { transform: translate(780px,215px) scale(1); opacity: 1; }
    97.16%  { transform: translate(1190px,125px) scale(1); opacity: 1; }
    98.41%  { transform: translate(1190px,125px) scale(1); opacity: 1; }
    99.09%  { transform: translate(1190px,125px) scale(1); opacity: 0; }
    100%    { transform: translate(1190px,125px) scale(1); opacity: 0; }
  }
  @keyframes req2-decline {
    0%      { transform: translate(-60px,300px) scale(1); opacity: 1; }
    0.64%   { transform: translate(220px,300px) scale(1); opacity: 1; }
    21.15%  { transform: translate(220px,300px) scale(1); opacity: 1; }
    27.56%  { transform: translate(780px,300px) scale(1); opacity: 1; }
    88.64%  { transform: translate(780px,300px) scale(1); opacity: 1; }
    97.16%  { transform: translate(1220px,455px) scale(1); opacity: 1; }
    98.41%  { transform: translate(1220px,455px) scale(1); opacity: 1; }
    99.09%  { transform: translate(1220px,455px) scale(1); opacity: 0; }
    100%    { transform: translate(1220px,455px) scale(1); opacity: 0; }
  }
  @keyframes req3-decline {
    0%      { transform: translate(-60px,510px) scale(1); opacity: 1; }
    0.64%   { transform: translate(220px,510px) scale(1); opacity: 1; }
    41.03%  { transform: translate(220px,510px) scale(1); opacity: 1; }
    47.44%  { transform: translate(780px,385px) scale(1); opacity: 1; }
    88.64%  { transform: translate(780px,385px) scale(1); opacity: 1; }
    97.16%  { transform: translate(1250px,395px) scale(1); opacity: 1; }
    98.41%  { transform: translate(1250px,395px) scale(1); opacity: 1; }
    99.09%  { transform: translate(1250px,395px) scale(1); opacity: 0; }
    100%    { transform: translate(1250px,395px) scale(1); opacity: 0; }
  }

  .r1 { animation-name: req1-accept; fill: #a68bc4; }
  .r2 { animation-name: req2-decline; fill: #e0a0b8; }
  .r3 { animation-name: req3-decline; fill: #e0c470; }

  .refill {
    transform-box: view-box;
    transform-origin: 0 0;
    animation-duration: 5.333s;
    animation-timing-function: cubic-bezier(.3,.7,.4,1);
    animation-iteration-count: infinite;
  }

  @keyframes refill1 {
    0%, 21.15% { transform: translate(220px,90px); opacity: 0; }
    21.5%      { transform: translate(-60px,90px); opacity: 0; }
    21.6%      { transform: translate(-60px,90px); opacity: 1; }
    30.5%      { transform: translate(220px,90px); opacity: 1; }
    100%       { transform: translate(220px,90px); opacity: 1; }
  }
  @keyframes refill2 {
    0%, 59.4%  { transform: translate(220px,300px); opacity: 0; }
    59.7%      { transform: translate(-60px,300px); opacity: 0; }
    59.8%      { transform: translate(-60px,300px); opacity: 1; }
    68.7%      { transform: translate(220px,300px); opacity: 1; }
    100%       { transform: translate(220px,300px); opacity: 1; }
  }
  @keyframes refill3 {
    0%, 50%    { transform: translate(220px,510px); opacity: 0; }
    50.3%      { transform: translate(-60px,510px); opacity: 0; }
    50.4%      { transform: translate(-60px,510px); opacity: 1; }
    59.4%      { transform: translate(220px,510px); opacity: 1; }
    100%       { transform: translate(220px,510px); opacity: 1; }
  }

  .f1 { animation-name: refill1; fill: #a68bc4; }
  .f2 { animation-name: refill2; fill: #e0a0b8; }
  .f3 { animation-name: refill3; fill: #e0c470; }

  .caption {
    font-size: 25px;
    font-weight: 700;
    fill: #999;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-anchor: middle;
  }
  .cap {
    animation-duration: 5.333s;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  .cap1 { animation-name: cap1; }
  .cap2 { animation-name: cap2; }

  @keyframes cap1 {
    0%, 40%   { opacity: 1; }
    55%, 100% { opacity: 0; }
  }
  @keyframes cap2 {
    0%, 40%   { opacity: 0; }
    55%, 100% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="stage">
  <svg viewBox="0 0 2100 1330">
    <rect width="2100" height="1330" fill="#fbf8f4"/>

    <g transform="translate(-197.06, 111.21) scale(1.7)">
    <text x="220" y="10">Incoming</text>
    <text x="220" y="30">Requests</text>

    <text x="900" y="180">Demand</text>
    <text x="900" y="200">Meeting</text>

    <rect class="bucket bucket-accept" x="1150" y="110" width="140" height="140" rx="14"/>
    <text x="1220" y="180" class="bucket-label" text-anchor="middle">Accept</text>

    <rect class="bucket bucket-decline" x="1150" y="350" width="140" height="140" rx="14"/>
    <text x="1220" y="420" class="bucket-label" text-anchor="middle">Decline</text>

    <circle class="lt-node" cx="900" cy="300" r="65"/>
    <text x="900" y="306" style="fill:#fff; font-size:12px; letter-spacing:0.5px;">LT</text>

    <rect class="refill f1" x="-33.6" y="-33.6" width="67.2" height="67.2" rx="8"/>
    <rect class="refill f2" x="-33.6" y="-33.6" width="67.2" height="67.2" rx="8"/>
    <rect class="refill f3" x="-33.6" y="-33.6" width="67.2" height="67.2" rx="8"/>

    <rect class="req r1" x="-33.6" y="-33.6" width="67.2" height="67.2" rx="8"/>
    <rect class="req r2" x="-33.6" y="-33.6" width="67.2" height="67.2" rx="8"/>
    <rect class="req r3" x="-33.6" y="-33.6" width="67.2" height="67.2" rx="8"/>

    <g class="vds">
      <circle cx="0" cy="0" r="41.6"/>
      <text x="0" y="6" style="fill:#fff; font-size:12px; letter-spacing:0.5px;">VDS</text>
    </g>

    <text x="700" y="650" class="caption cap cap1">1. VDS gathers info &amp; scores requests</text>
    <text x="700" y="650" class="caption cap cap2">2. Leadership discussion &amp; decision making</text>
    </g>

  </svg>
</div>

</body>
</html>
